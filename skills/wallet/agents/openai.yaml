interface:
  display_name: "Wallet"
  short_description: "Manage local Web3 named mnemonics and accounts, derive addresses, check balances, and query, approve, or transfer ERC-20 tokens through one Python CLI."
  default_prompt: "Use $wallet to manage a local wallet with one Python command, keep mnemonics and private keys masked, and prefer named accounts over fallback resolution. Store wallet state in ~/.uxuy-wallet/.accounts as a tree of top-level secret roots. Each root is a named mnemonic or private key; mnemonic roots branch into evm, svm, and tvm, and each supported branch stores its private key, address, and an optional key-level account name. Private-key imports should be stored as a single-leaf private root with one address_type, one private key, and one address, without empty family branches. This is a direct switch to the new tree layout and does not need to preserve older .accounts schemas. Support mnemonic generate/import/list/show with --name, private generate/import with --name, account add/list/show/use for mnemonic-derived accounts that reference a named mnemonic root, derive addresses for bsc/base/ethereum/tron/solana, query tracked balances on bsc/base/ethereum/solana plus native TRX on tron, and handle ERC-20 query, approve, and transfer flows on EVM chains. The tvm branch should derive TRON-compatible private keys and addresses. Account-facing output should prefer address families such as evm/svm/tvm rather than any single-chain label. Use built-in public RPC defaults when no env override is set, and if an RPC node fails or is rate-limited, tell the user to switch the matching BSC_RPC_URL, BASE_RPC_URL, ETHEREUM_RPC_URL, SOLANA_RPC_URL, or TRON_RPC_URL to another node. Token queries should return standard ERC-20 info such as total supply and cache previously unknown tokens into ~/.uxuy-wallet/.tokens for reuse."
